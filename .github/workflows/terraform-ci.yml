name: "Terraform CI & Security Validation"

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate:
    name: "Lint, Validate & Security Scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # 3. Check Terraform Formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 4. Terraform Init & Validate
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # 5. TFLint Static Analysis
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.50.0"

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      # 6. Checkov Policy as Code Scan
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: false # Set to true if you only want warnings without blocking the build

      # 7. Trivy Vulnerability & Misconfiguration Scan
      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-dir: "terraform"
          severity: "CRITICAL,HIGH"
          exit-code: "1" # Fail pipeline if Critical/High misconfigurations are detected